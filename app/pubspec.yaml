name: nexa
description: NEXA — smart messaging that turns conversations into actions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_tts: ^4.2.5
  http: ^1.6.0
  porcupine_flutter: ^4.0.0
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Inter is bundled (not fetched at runtime) so text lays out correctly on
  # first frame and the app looks right offline. License: assets/fonts/inter/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
